name: Reusable Java Build

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: true
        type: string
        default: '21'

    secrets:
      demo-token:
        required: true

jobs:
  java-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Check demo secret
        env:
          DEMO_TOKEN: ${{ secrets.demo-token }}
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "Demo secret was provided"
          else
            echo "Demo secret was not provide"
            exit 1
          fi

      - name: Build and test
        run: ./mvnw clean verify