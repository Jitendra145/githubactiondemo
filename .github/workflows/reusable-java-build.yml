name: Reusable Java Build

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: true
        type: string
        default: '21'

jobs:
  java-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify